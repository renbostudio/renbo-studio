
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | RENBO STUDIO</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 40px;
    border-radius: 12px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

h1 {
    font-size: 26px;
    margin-bottom: 10px;
}

.description {
    color: #777;
    font-size: 14px;
    margin-bottom: 30px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 15px;
    background: #111;
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

#message {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.5;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #777;
    font-size: 13px;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">
    <div class="logo">RENBO STUDIO</div>

    <h1>Admin Login</h1>
    <p class="description">
        Masuk untuk mengelola website Renbo Studio.
    </p>

    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email"
            placeholder="Masukkan email admin" required>

        <label>Password</label>
        <input type="password" id="password"
            placeholder="Masukkan password" required>

        <button type="submit" id="loginButton">
            MASUK
        </button>
    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Kembali ke website
    </a>
</div>

<script type="module">
import { supabase } from './supabase.js';

const form = document.getElementById('loginForm');
const button = document.getElementById('loginButton');
const message = document.getElementById('message');

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = 'MEMERIKSA...';
    message.textContent = '';

    try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        const { data, error: adminError } =
            await supabase.rpc('is_admin');

        if (adminError) throw adminError;

        if (data !== true) {
            await supabase.auth.signOut();
            throw new Error('Akun ini tidak memiliki akses admin.');
        }

        message.style.color = 'green';
        message.textContent = 'Login berhasil! Membuka dashboard...';

        window.location.href = 'dashboard.html';

    } catch (error) {
        message.style.color = 'red';
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = 'MASUK';
    }
});
</script>

</body>
</html>
